# Staging Profile
# Balanced configuration for staging/testing environments
#
# Usage:
#   export MCP_PROFILE=staging
#   mcp-compose up --profile staging
#
# Or merge with your config:
#   mcp-compose up -f mcp-compose.yaml -f config/profiles/staging.yaml

version: '1'

proxy_auth:
  enabled: true
  api_key: "${MCP_API_KEY}"
  oauth_fallback: true

oauth:
  enabled: true
  issuer: "${OAUTH_ISSUER}"
  tokens:
    access_token_ttl: "30m"
    refresh_token_ttl: "24h"
    authorization_code_ttl: "10m"
  security:
    require_pkce: true

audit:
  enabled: true
  log_level: "info"
  storage: "file"
  file:
    log_dir: "/var/log/mcp-compose"
    max_file_size: "100MB"
    max_age: "7d"
  retention:
    max_entries: 10000
    max_age: "7d"
  events:
    - "oauth.token.issued"
    - "oauth.token.revoked"
    - "server.access.denied"
    - "tool.executed"
    - "error.occurred"

rbac:
  enabled: true
  roles:
    tester:
      name: "tester"
      description: "Testing access"
      scopes: ["mcp:tools", "mcp:resources"]

logging:
  level: "info"
  format: "json"
  destinations:
    - type: stdout
    - type: file
      path: "/var/log/mcp-compose-staging.log"

connections:
  default:
    timeouts:
      connect: "10s"
      read: "30s"
      write: "30s"
      idle: "60s"
      health_check: "5s"
      shutdown: "30s"

dashboard:
  enabled: true
  port: 3001
  host: "localhost"
  theme: "dark"
  log_streaming: true
  config_editor: true
  metrics: true

servers:
  _defaults:
    pull: true
    restart: "on-failure"
    log_driver: "json-file"
    log_options:
      max-size: "20m"
      max-file: "3"
      compress: "true"

    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512m"
          pids: 100
        reservations:
          cpus: "0.5"
          memory: "256m"

    healthcheck:
      interval: "30s"
      timeout: "5s"
      retries: 3
      start_period: "20s"

    authentication:
      enabled: true
      allow_api_key: true

monitoring:
  metrics:
    enabled: true
    port: 9090