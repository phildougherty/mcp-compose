# MCP-Compose Advanced Example
# Full-featured setup with OAuth, monitoring, audit logging, and 10+ servers
#
# Setup time: 10 minutes
# Number of servers: 12
# Complexity: High
# Features:
#   - OAuth 2.1 with PKCE authentication
#   - Role-based access control (RBAC)
#   - Audit logging to PostgreSQL
#   - Web dashboard with monitoring
#   - Multiple specialized MCP servers
#   - Health checks and lifecycle hooks
#   - Resource limits and security hardening
#   - Custom networks for isolation
#
# Required environment variables:
#   - MCP_API_KEY
#   - OAUTH_CLIENT_SECRET
#   - POSTGRES_PASSWORD
#   - GITHUB_TOKEN
#   - OPENROUTER_API_KEY
#
# Usage:
#   1. cp .env.example .env
#   2. Edit .env with your secrets
#   3. source .env
#   4. mcp-compose up
#   5. mcp-compose proxy --port 9876
#   6. Open dashboard at http://localhost:3001

version: '1'

proxy_auth:
  enabled: true
  api_key: "${MCP_API_KEY}"
  oauth_fallback: true

oauth:
  enabled: true
  issuer: "http://localhost:9876"
  endpoints:
    authorization: "/oauth/authorize"
    token: "/oauth/token"
    userinfo: "/oauth/userinfo"
    revoke: "/oauth/revoke"
    discovery: "/.well-known/oauth-authorization-server"
  tokens:
    access_token_ttl: "1h"
    refresh_token_ttl: "168h"
    authorization_code_ttl: "10m"
    algorithm: "HS256"
  security:
    require_pkce: true
  grant_types:
    - "authorization_code"
    - "client_credentials"
    - "refresh_token"
  response_types:
    - "code"
  scopes_supported:
    - "mcp:*"
    - "mcp:tools"
    - "mcp:resources"
    - "mcp:prompts"

audit:
  enabled: true
  log_level: "info"
  storage: "postgres"
  retention:
    max_entries: 10000
    max_age: "30d"
  events:
    - "oauth.token.issued"
    - "oauth.token.revoked"
    - "oauth.user.login"
    - "server.access.granted"
    - "server.access.denied"
    - "tool.executed"
    - "resource.accessed"

rbac:
  enabled: true
  scopes:
    - name: "mcp:*"
      description: "Full access to all MCP resources"
    - name: "mcp:tools"
      description: "Access to MCP tools"
    - name: "mcp:resources"
      description: "Access to MCP resources"
    - name: "mcp:prompts"
      description: "Access to MCP prompts"
  roles:
    admin:
      name: "admin"
      description: "Full administrative access"
      scopes: ["mcp:*"]
    developer:
      name: "developer"
      description: "Developer access"
      scopes: ["mcp:tools", "mcp:resources", "mcp:prompts"]
    readonly:
      name: "readonly"
      description: "Read-only access"
      scopes: ["mcp:resources"]

oauth_clients:
  web-app:
    client_id: "web-app-client"
    client_secret: "${OAUTH_CLIENT_SECRET}"
    name: "Web Application"
    description: "Main web application client"
    redirect_uris:
      - "http://localhost:3000/callback"
      - "http://localhost:3001/callback"
    scopes: ["mcp:*"]
    grant_types: ["authorization_code", "refresh_token"]
    public_client: false
    auto_approve: false

dashboard:
  enabled: true
  port: 3001
  host: "0.0.0.0"
  proxy_url: "http://localhost:9876"
  postgres_url: "postgresql://mcp:${POSTGRES_PASSWORD}@postgres:5432/mcp"
  theme: "dark"
  log_streaming: true
  config_editor: true
  metrics: true
  security:
    enabled: true
    oauth_config: true
    client_management: true
    user_management: true
    audit_logs: true
  admin_login:
    enabled: true
    session_timeout: "24h"

connections:
  default:
    timeouts:
      connect: "10s"
      read: "30s"
      write: "30s"
      idle: "60s"
      health_check: "5s"
      shutdown: "30s"
      lifecycle_hook: "30s"

servers:
  postgres:
    image: "postgres:15-alpine"
    env:
      POSTGRES_USER: "mcp"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "mcp"
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp"]
      interval: "10s"
      timeout: "5s"
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512m"

  filesystem:
    image: "mcp/filesystem:latest"
    capabilities: [resources, tools]
    volumes:
      - "${HOME}/Documents:/workspace:ro"
    networks:
      - frontend
    authentication:
      enabled: true
      required_scope: "mcp:resources"
      allow_api_key: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: "30s"
      timeout: "5s"
      retries: 3
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256m"

  memory:
    image: "mcp/memory:latest"
    capabilities: [tools, resources]
    depends_on:
      - postgres
    env:
      DATABASE_URL: "postgresql://mcp:${POSTGRES_PASSWORD}@postgres:5432/mcp"
    networks:
      - frontend
      - backend
    authentication:
      enabled: true
      required_scope: "mcp:tools"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: "30s"
      timeout: "5s"
      retries: 3
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512m"

  search:
    image: "mcp/search:latest"
    capabilities: [tools]
    env:
      SEARCH_ENGINE: "duckduckgo"
    networks:
      - frontend
    authentication:
      enabled: true
      required_scope: "mcp:tools"
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256m"

  git:
    image: "mcp/git:latest"
    capabilities: [tools]
    volumes:
      - "${HOME}/.gitconfig:/root/.gitconfig:ro"
      - "${HOME}/code:/workspace:rw"
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
    networks:
      - frontend
    authentication:
      enabled: true
      required_scope: "mcp:tools"
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512m"

  github:
    image: "mcp/github:latest"
    capabilities: [tools, resources]
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
    networks:
      - frontend
    authentication:
      enabled: true
      required_scope: "mcp:tools"
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256m"

  slack:
    image: "mcp/slack:latest"
    capabilities: [tools]
    env:
      SLACK_TOKEN: "${SLACK_TOKEN}"
    networks:
      - frontend
    authentication:
      enabled: true
      required_scope: "mcp:tools"
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256m"

  database:
    image: "mcp/database:latest"
    capabilities: [tools, resources]
    depends_on:
      - postgres
    env:
      DATABASE_URL: "postgresql://mcp:${POSTGRES_PASSWORD}@postgres:5432/mcp"
    networks:
      - frontend
      - backend
    authentication:
      enabled: true
      required_scope: "mcp:tools"
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512m"

  web-browser:
    image: "mcp/puppeteer:latest"
    capabilities: [tools]
    networks:
      - frontend
    authentication:
      enabled: true
      required_scope: "mcp:tools"
    security:
      allow_privileged_ops: false
      no_new_privileges: true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2g"

  code-runner:
    image: "mcp/code-runner:latest"
    capabilities: [tools]
    env:
      ALLOWED_LANGUAGES: "python,javascript,typescript,go,rust"
      EXECUTION_TIMEOUT: "30s"
    networks:
      - frontend
    authentication:
      enabled: true
      required_scope: "mcp:tools"
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp", "/var/tmp"]
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512m"
          pids: 50

  ai-assistant:
    image: "mcp/openrouter:latest"
    capabilities: [tools, prompts]
    env:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENROUTER_MODEL: "anthropic/claude-3.5-sonnet"
    networks:
      - frontend
    authentication:
      enabled: true
      required_scope: "mcp:tools"
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256m"

  time:
    image: "mcp/time:latest"
    capabilities: [tools, resources]
    networks:
      - frontend
    authentication:
      enabled: false
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128m"

  weather:
    image: "mcp/weather:latest"
    capabilities: [tools, resources]
    env:
      WEATHER_API_KEY: "${WEATHER_API_KEY}"
    networks:
      - frontend
    authentication:
      enabled: true
      required_scope: "mcp:tools"
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128m"

networks:
  frontend:
    driver: bridge
    labels:
      com.mcp.network: "frontend"
  backend:
    driver: bridge
    internal: true
    labels:
      com.mcp.network: "backend"

volumes:
  postgres-data:
    driver: local
    labels:
      com.mcp.volume: "database"

logging:
  level: "info"
  format: "json"
  destinations:
    - type: stdout
    - type: file
      path: "/var/log/mcp-compose.log"

monitoring:
  metrics:
    enabled: true
    port: 9090