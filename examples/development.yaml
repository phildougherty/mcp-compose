# MCP-Compose Development Example
# Optimized for software development with Git, filesystem, and tools
#
# Setup time: 3 minutes
# Number of servers: 5
# Complexity: Medium
# Features:
#   - Filesystem access to code directories
#   - Git operations
#   - Memory/notes for context
#   - Web search for documentation
#   - Code execution (Python/Node.js)
#   - Development-friendly timeouts
#
# Usage:
#   1. export MCP_API_KEY=$(openssl rand -hex 32)
#   2. mcp-compose up
#   3. mcp-compose proxy --port 9876

version: '1'

proxy_auth:
  enabled: true
  api_key: "${MCP_API_KEY}"

connections:
  default:
    timeouts:
      connect: "10s"
      read: "60s"
      write: "60s"
      idle: "120s"

servers:
  filesystem:
    image: "mcp/filesystem:latest"
    capabilities: [resources, tools]
    volumes:
      - "${HOME}/code:/workspace:rw"
    env:
      MAX_FILE_SIZE: "10MB"

  git:
    image: "mcp/git:latest"
    capabilities: [tools]
    volumes:
      - "${HOME}/.gitconfig:/root/.gitconfig:ro"
      - "${HOME}/code:/workspace:rw"
    env:
      GIT_USER_NAME: "${GIT_USER_NAME}"
      GIT_USER_EMAIL: "${GIT_USER_EMAIL}"

  memory:
    image: "mcp/memory:latest"
    capabilities: [tools, resources]
    env:
      DATABASE_URL: "sqlite:///data/memory.db"
    volumes:
      - "dev-memory:/data"

  search:
    image: "mcp/search:latest"
    capabilities: [tools]
    env:
      SEARCH_ENGINE: "duckduckgo"

  code-runner:
    image: "mcp/code-runner:latest"
    capabilities: [tools]
    env:
      ALLOWED_LANGUAGES: "python,javascript,typescript,go"
      EXECUTION_TIMEOUT: "30s"
    security:
      allow_privileged_ops: false
      no_new_privileges: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512m"
          pids: 50

volumes:
  dev-memory:
    driver: local

logging:
  level: "debug"
  format: "text"